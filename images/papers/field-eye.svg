<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fff"/>
  <!-- shelf grid of products -->
  <g>
    <rect x="24" y="30" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
    <rect x="120" y="30" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
    <rect x="216" y="30" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
    <rect x="24" y="102" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
    <rect x="120" y="102" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
    <rect x="216" y="102" width="80" height="56" rx="6" fill="#f3ebe9" stroke="#e3d4d2"/>
  </g>
  <!-- attribute label bands (brand cues) -->
  <g fill="#7a1f2b" opacity="0.85">
    <rect x="32" y="38" width="40" height="9" rx="3"/>
    <rect x="128" y="38" width="40" height="9" rx="3"/>
    <rect x="224" y="38" width="40" height="9" rx="3"/>
    <rect x="32" y="110" width="40" height="9" rx="3"/>
    <rect x="128" y="110" width="40" height="9" rx="3"/>
    <rect x="224" y="110" width="40" height="9" rx="3"/>
  </g>
  <g fill="#c9bdb6">
    <rect x="32" y="56" width="58" height="6" rx="3"/>
    <rect x="32" y="68" width="46" height="6" rx="3"/>
    <rect x="128" y="56" width="58" height="6" rx="3"/>
    <rect x="128" y="68" width="46" height="6" rx="3"/>
    <rect x="224" y="56" width="58" height="6" rx="3"/>
    <rect x="224" y="68" width="46" height="6" rx="3"/>
  </g>
  <!-- attribute-guided gaze scanpath across brand band -->
  <polyline points="52,42 148,42 244,42 80,114 176,114 244,114"
    fill="none" stroke="#a23a48" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>
  <g fill="#7a1f2b">
    <circle cx="52" cy="42" r="6"/><circle cx="148" cy="42" r="6"/><circle cx="244" cy="42" r="6"/>
    <circle cx="80" cy="114" r="6"/><circle cx="176" cy="114" r="6"/><circle cx="244" cy="114" r="9"/>
  </g>
  <!-- caption -->
  <rect x="24" y="186" width="272" height="34" rx="7" fill="#faf7f4" stroke="#e8e4df"/>
  <text x="160" y="207" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#646b73">attribute-guided search across the shelf</text>
</svg>
