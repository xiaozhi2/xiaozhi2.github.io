<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fff"/>
  <!-- memory cloud -->
  <g>
    <ellipse cx="78" cy="120" rx="58" ry="46" fill="#f3ebe9" stroke="#e3d4d2"/>
    <text x="78" y="74" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#646b73">memory</text>
  </g>
  <!-- recalled options at different accessibility (size/opacity) -->
  <g font-family="Georgia,serif" text-anchor="middle">
    <circle cx="62" cy="106" r="20" fill="#7a1f2b"/>
    <text x="62" y="110" font-size="12" fill="#fff">1st</text>
    <circle cx="98" cy="132" r="15" fill="#a23a48" opacity="0.85"/>
    <text x="98" y="136" font-size="10" fill="#fff">2nd</text>
    <circle cx="64" cy="150" r="11" fill="#c98b93" opacity="0.8"/>
    <text x="64" y="154" font-size="9" fill="#fff">3rd</text>
  </g>
  <!-- accumulation arrows toward decision -->
  <g stroke="#a23a48" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M150 110 H214" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#a23a48"/>
    </marker>
  </defs>
  <!-- evidence accumulation to threshold -->
  <rect x="222" y="40" width="78" height="150" rx="8" fill="#faf7f4" stroke="#e8e4df"/>
  <line x1="230" y1="56" x2="292" y2="56" stroke="#c9bdb6" stroke-dasharray="3 3"/>
  <text x="261" y="50" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#646b73">choose</text>
  <polyline points="230,176 244,150 252,156 266,108 278,90 288,58"
    fill="none" stroke="#7a1f2b" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="288" cy="58" r="4" fill="#7a1f2b"/>
  <!-- caption -->
  <rect x="20" y="200" width="280" height="30" rx="7" fill="#faf7f4" stroke="#e8e4df"/>
  <text x="160" y="219" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" fill="#646b73">earlier-recalled options win more often</text>
</svg>
