    <text x="0" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#646b73">AI agent</text>
  </g>
  <!-- blocked arrow -->
  <line x1="208" y1="96" x2="170" y2="96" stroke="#c0392b" stroke-width="2.5" marker-end="url(#x)"/>
  <line x1="184" y1="84" x2="196" y2="108" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
