  <circle cx="115" cy="96" r="11" fill="#7a1f2b"/>
  <circle cx="115" cy="96" r="4.5" fill="#fff"/>
  <text x="115" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#646b73">webcam gaze</text>
