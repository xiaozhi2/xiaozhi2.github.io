  <rect x="30" y="34" width="170" height="150" rx="10" fill="#faf7f4" stroke="#e3d4d2"/>
  <rect x="30" y="34" width="170" height="22" rx="10" fill="#f3ebe9"/>
  <circle cx="44" cy="45" r="3" fill="#c98b93"/><circle cx="54" cy="45" r="3" fill="#d8bfae"/><circle cx="64" cy="45" r="3" fill="#cdbf9e"/>
