<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250">
  <rect width="460" height="250" fill="#fff"/>
  <text x="230" y="24" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#161616">Decide-while-Searching</text>

  <!-- LEFT: starting point mechanism -->
  <text x="118" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#161616">Starting point mechanism</text>
  <!-- axes -->
  <line x1="40" y1="60" x2="40" y2="232" stroke="#161616" stroke-width="2"/>
  <line x1="40" y1="150" x2="214" y2="150" stroke="#161616" stroke-width="1"/>
  <!-- decision boundary -->
  <line x1="40" y1="66" x2="214" y2="66" stroke="#161616" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="150" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1f4e79">Decision Boundary</text>
  <!-- more accessible (dark, starts at 0) -->
  <polyline fill="none" stroke="#6b6b6b" stroke-width="2.2" points="40,150 50,142 58,146 68,134 76,138 86,126 94,130 104,118 112,124 122,112 130,116 140,104 150,108 160,96 168,100 178,88 188,84 198,74 206,70 214,66"/>
  <text x="96" y="116" font-family="Georgia,serif" font-size="10" fill="#1f4e79">More accessible</text>
  <!-- less accessible (light, starts below 0) -->
  <polyline fill="none" stroke="#cfcfcf" stroke-width="2.2" points="40,214 50,206 58,212 68,200 76,206 86,192 94,198 104,186 112,192 122,178 130,184 140,170 150,176 160,162 168,168 178,156 188,150 198,142 206,136 214,132"/>
  <text x="150" y="148" font-family="Georgia,serif" font-size="10" fill="#1f4e79">Less accessible</text>
  <text x="150" y="166" font-family="Georgia,serif" font-size="11" fill="#1f4e79">Time</text>
  <!-- starting point arrow -->
  <line x1="34" y1="152" x2="34" y2="226" stroke="#c0392b" stroke-width="2.5" marker-end="url(#sp)"/>
  <text x="20" y="195" font-family="Georgia,serif" font-size="9" fill="#c0392b" text-anchor="middle" transform="rotate(-90 20 195)">Starting point</text>
  <text x="20" y="146" font-family="Georgia,serif" font-size="11" fill="#1f4e79" text-anchor="middle" transform="rotate(-90 20 120)">Evidence</text>

  <!-- RIGHT: attentional boost mechanism -->
  <text x="346" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#161616">Attentional boost mechanism</text>
  <line x1="262" y1="60" x2="262" y2="232" stroke="#161616" stroke-width="2"/>
  <line x1="262" y1="200" x2="446" y2="200" stroke="#161616" stroke-width="1"/>
  <line x1="262" y1="66" x2="446" y2="66" stroke="#161616" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="378" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1f4e79">Decision Boundary</text>
  <!-- more accessible (dark) -->
  <polyline fill="none" stroke="#6b6b6b" stroke-width="2.2" points="262,200 272,190 280,194 290,180 298,184 308,170 316,160 326,150 334,140 344,132 352,118 362,114 372,104 382,96 392,90 402,82 412,78 424,72 436,68 446,66"/>
  <text x="320" y="110" font-family="Georgia,serif" font-size="10" fill="#1f4e79">More accessible</text>
  <!-- less accessible (light) -->
  <polyline fill="none" stroke="#cfcfcf" stroke-width="2.2" points="262,200 272,194 280,196 290,184 298,182 308,172 316,166 326,158 334,150 344,144 352,150 362,140 372,134 382,128 392,124 402,118 412,114 424,108 436,102 446,96"/>
  <text x="338" y="146" font-family="Georgia,serif" font-size="10" fill="#1f4e79">Less accessible</text>
  <text x="392" y="216" font-family="Georgia,serif" font-size="11" fill="#1f4e79">Time</text>
  <!-- attentional boost arrow -->
  <path d="M430 96 q12 -16 4 -28" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="408" y="120" font-family="Georgia,serif" font-size="9.5" fill="#c0392b">Attentional boost</text>
  <text x="256" y="146" font-family="Georgia,serif" font-size="11" fill="#1f4e79" text-anchor="middle" transform="rotate(-90 256 140)">Evidence</text>

  <defs>
    <marker id="sp" markerWidth="9" markerHeight="9" refX="3" refY="7" orient="auto"><path d="M0 0 L6 0 L3 7 z" fill="#c0392b"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#c0392b"/></marker>
  </defs>
</svg>
