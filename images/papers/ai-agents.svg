    <rect x="-22" y="-20" width="44" height="38" rx="7" fill="#f3ebe9" stroke="#c98b93" stroke-width="2"/>
    <circle cx="-9" cy="-3" r="4" fill="#a23a48"/><circle cx="9" cy="-3" r="4" fill="#a23a48"/>
